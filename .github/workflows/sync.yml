name: Sync Catalog from Provider

on:
  schedule:
    # Se ejecuta automáticamente cada 3 horas
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permite ejecución manual desde la interfaz de GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22   # CORRECCIÓN: Node 22 incluye soporte nativo estable de WebSockets
          cache: 'npm'
          cache-dependency-path: catálogo-pro/package.json

      - name: Install dependencies
        run: |
          cd catálogo-pro
          npm install

      - name: Run synchronization script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node catálogo-pro/scripts/sync-provider.js