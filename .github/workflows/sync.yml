name: Sync Catalog from Provider

on:
  schedule:
    # Sincroniza de forma invisible cada 3 horas
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permite dispararlo manualmente desde la web de GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: catálogo-pro/package.json

      - name: Install dependencies with Puppeteer
        run: |
          cd catálogo-pro
          npm install @supabase/supabase-js puppeteer

      - name: Run synchronization script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node catálogo-pro/scripts/sync-provider.js