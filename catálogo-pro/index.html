    <script type="module">
        import { createClient } from '@supabase/supabase-js';

        const SUPABASE_URL = "https://ehxsodyuzpduggxbffmk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_uy1GN_7GdX5y-D-WwWnB3w_NFUJHT-S";
        
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
        let products = [];
        let cart = JSON.parse(localStorage.getItem('cart_pro')) || [];

        async function init() {
            // Sincronización inicial del tema persistente compartido
            const savedTheme = localStorage.getItem('gini_theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
            }
            updateThemeToggleIcon();

            lucide.createIcons();
            setupEventListeners();
            await fetchProducts();
            renderCart();
            updateWhatsAppLink();
        }

        function setupEventListeners() {
            document.getElementById('openCart').onclick = toggleCart;
            document.getElementById('closeCart').onclick = toggleCart;
            document.getElementById('cartOverlay').onclick = toggleCart;
            document.getElementById('closeModal').onclick = closeModal;
            document.getElementById('productModal').onclick = (e) => {
                if (e.target === document.getElementById('productModal')) closeModal();
            };
            document.getElementById('checkoutBtn').onclick = finalizeOrder;
            document.getElementById('searchInput').oninput = handleSearchAndSort;
            document.getElementById('sortSelect').onchange = handleSearchAndSort;
            document.getElementById('themeToggle').onclick = toggleTheme;
        }

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('gini_theme', isDark ? 'dark' : 'light');
            updateThemeToggleIcon();
        }

        function updateThemeToggleIcon() {
            const toggleBtn = document.getElementById('themeToggle');
            if (!toggleBtn) return;
            const isDark = document.body.classList.contains('dark-mode');
            toggleBtn.innerHTML = isDark ? '<i data-lucide="sun" class="w-4 h-4 text-amber-400"></i>' : '<i data-lucide="moon" class="w-4 h-4"></i>';
            lucide.createIcons();
        }

        async function fetchProducts() {
            try {
                const { data, error } = await supabaseClient
                    .from('productos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                products = data;
                handleSearchAndSort();
            } catch (error) {
                console.error('Error fetching products:', error);
            }
        }

        function handleSearchAndSort() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const sortCriteria = document.getElementById('sortSelect').value;
            
            let processedList = products.filter(product => 
                product.titulo.toLowerCase().includes(query)
            );
            
            if (sortCriteria === 'price-asc') {
                processedList.sort((a, b) => (a.precio || 0) - (b.precio || 0));
            } else if (sortCriteria === 'price-desc') {
                processedList.sort((a, b) => (b.precio || 0) - (a.precio || 0));
            } else if (sortCriteria === 'name-asc') {
                processedList.sort((a, b) => a.titulo.localeCompare(b.titulo));
            } else if (sortCriteria === 'name-desc') {
                processedList.sort((a, b) => b.titulo.localeCompare(a.titulo));
            }
            
            renderProducts(processedList);
        }

        function renderProducts(productsToRender) {
            const grid = document.getElementById('productGrid');
            const countEl = document.getElementById('productCount');
            
            if (productsToRender.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-24 flex flex-col items-center text-center text-slate-400">
                        <div class="w-14 h-14 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                            <i data-lucide="search-x" class="w-5 h-5 text-slate-400"></i>
                        </div>
                        <h4 class="text-sm font-bold text-slate-800">No hay coincidencias</h4>
                    </div>
                `;
                countEl.textContent = '0 PRODUCTOS';
                lucide.createIcons();
                return;
            }

            countEl.textContent = `${productsToRender.length} PRODUCTOS`;

            grid.innerHTML = productsToRender.map((product, index) => `
                <div class="card-minimal flex flex-col overflow-hidden fade-in" style="animation-delay: ${index * 0.01}s">
                    <div class="relative bg-slate-50 aspect-square cursor-pointer overflow-hidden group" onclick="openProductDetail(${product.id})">
                        <img src="${product.imagen_url}" alt="${product.titulo}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute inset-0 bg-slate-900/0 group-hover:bg-slate-900/20 transition-all flex items-center justify-center opacity-0 group-hover:opacity-100 backdrop-blur-[1px]">
                            <span class="bg-white text-slate-900 px-4 py-1.5 rounded-full text-[10px] font-bold shadow-xl">Quick View</span>
                        </div>
                    </div>
                    <div class="p-3 flex flex-col flex-1">
                        <h4 class="font-bold text-slate-900 mb-0.5 leading-tight line-clamp-1 text-xs capitalize">${product.titulo}</h4>
                        <p class="text-slate-400 text-[11px] mb-3 line-clamp-1 leading-relaxed">${product.descripcion || 'Sin descripción'}</p>
                        
                        <div class="mt-auto pt-2 border-t border-slate-50 flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-900">$${(product.precio || 0).toLocaleString()}</span>
                            
                            <div class="flex items-center gap-1.5">
                                <div class="qty-minimal flex items-center gap-1.5">
                                    <button onclick="event.stopPropagation(); changeQtyInGrid(${product.id}, -1)" class="w-5 h-5 flex items-center justify-center font-bold text-slate-400 hover:text-slate-900 transition-colors text-xs">-</button>
                                    <input type="number" id="qty-${product.id}" value="1" min="1" class="w-5 text-center text-[11px] font-bold border-none focus:ring-0 p-0 bg-transparent" onclick="event.stopPropagation()">
                                    <button onclick="event.stopPropagation(); changeQtyInGrid(${product.id}, 1)" class="w-5 h-5 flex items-center justify-center font-bold text-slate-400 hover:text-slate-900 transition-colors text-xs">+</button>
                                </div>
                                <button onclick="event.stopPropagation(); addToCart(${product.id}, parseInt(document.getElementById('qty-${product.id}').value))" class="btn-primary p-2 rounded-lg cursor-pointer">
                                    <i data-lucide="shopping-cart" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');
            const countEl = document.getElementById('cartCount');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-300 text-center">
                        <p class="text-sm font-medium">Bolsa vacía</p>
                    </div>
                `;
                totalEl.textContent = '$0';
                countEl.classList.add('hidden');
                return;
            }

            let total = 0;
            let count = 0;

            container.innerHTML = cart.map(item => {
                const subtotal = (item.precio || 0) * item.qty;
                total += subtotal;
                count += item.qty;
                return `
                <div class="flex gap-4 group">
                    <div class="w-14 h-14 bg-slate-50 rounded-lg overflow-hidden flex-shrink-0 border">
                        <img src="${item.imagen_url}" alt="${item.titulo}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start mb-1">
                            <h5 class="font-bold text-xs text-slate-900 truncate leading-none capitalize">${item.titulo}</h5>
                            <button onclick="removeFromCart(${item.id})" class="text-slate-300 hover:text-red-500 transition-colors cursor-pointer">
                                <i data-lucide="x" class="w-3 h-3"></i>
                            </button>
                        </div>
                        <p class="text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-wider">${item.qty} x $${(item.precio || 0).toLocaleString()}</p>
                        <div class="flex items-center justify-between">
                             <div class="qty-minimal flex items-center gap-1.5 px-1 py-0.5">
                                <button onclick="updateCartQty(${item.id}, -1)" class="w-4 h-4 flex items-center justify-center text-[10px] text-slate-400 hover:text-slate-900">-</button>
                                <span class="text-[10px] font-bold text-slate-900 w-3 text-center">${item.qty}</span>
                                <button onclick="updateCartQty(${item.id}, 1)" class="w-4 h-4 flex items-center justify-center text-[10px] text-slate-400 hover:text-slate-900">+</button>
                            </div>
                            <span class="text-xs font-bold text-slate-900">$${subtotal.toLocaleString()}</span>
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            totalEl.textContent = `$${total.toLocaleString()}`;
            countEl.textContent = count;
            countEl.classList.remove('hidden');
            lucide.createIcons();
        }

        function addToCart(productId, quantity) {
            const productToAdd = products.find(p => p.id === productId);
            if (!productToAdd) return;

            const existingCartItem = cart.find(item => item.id === productId);
            if (existingCartItem) {
                existingCartItem.qty += quantity;
            } else {
                cart.push({ ...productToAdd, qty: quantity });
            }
            saveCart();
            renderCart();
            showCartFeedback();
        }

        function updateCartQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) removeFromCart(id);
                else { saveCart(); renderCart(); }
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            saveCart();
            renderCart();
        }

        function saveCart() { localStorage.setItem('cart_pro', JSON.stringify(cart)); }

        function toggleCart() {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('cartOverlay');
            if (drawer.classList.contains('closed')) {
                drawer.classList.replace('closed', 'open');
                overlay.classList.replace('opacity-0', 'opacity-100');
                overlay.classList.remove('pointer-events-none');
                document.body.style.overflow = 'hidden';
            } else {
                drawer.classList.replace('open', 'closed');
                overlay.classList.replace('opacity-100', 'opacity-0');
                overlay.classList.add('pointer-events-none');
                document.body.style.overflow = 'auto';
            }
        }

        function openProductDetail(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            
            document.getElementById('modalImg').src = product.imagen_url;
            document.getElementById('modalTitle').textContent = product.titulo;
            document.getElementById('modalPrice').textContent = `$${(product.precio || 0).toLocaleString()}`;
            document.getElementById('modalDescription').textContent = product.descripcion || 'Sin descripción detallada disponible.';
            document.getElementById('modalQty').value = 1;
            
            const modal = document.getElementById('productModal');
            modal.classList.replace('hidden', 'visible');
            document.body.style.overflow = 'hidden';
            
            document.getElementById('modalAddBtn').onclick = () => {
                addToCart(product.id, parseInt(document.getElementById('modalQty').value));
                closeModal();
            };
        }

        function closeModal() {
            const modal = document.getElementById('productModal');
            modal.classList.replace('visible', 'hidden');
            document.body.style.overflow = 'auto';
        }

        function updateModalQty(delta) {
            const input = document.getElementById('modalQty');
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            input.value = val;
        }

        function changeQtyInGrid(id, delta) {
            const input = document.getElementById(`qty-${id}`);
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            input.value = val;
        }

        function finalizeOrder() {
            if (cart.length === 0) return alert('El carrito está vacío');
            let total = 0;
            let message = "Hola! Me interesa realizar el siguiente pedido:\n\n";
            cart.forEach(item => {
                total += (item.precio || 0) * item.qty;
                message += `*${item.qty}x* ${item.titulo} ($${(item.precio || 0).toLocaleString()})\n`;
            });
            message += `\n*Total:* $${total.toLocaleString()}`;
            window.open(`https://wa.me/5493513278986?text=${encodeURIComponent(message)}`, '_blank');
        }

        function updateWhatsAppLink() {
            document.getElementById('whatsappFloating').href = `https://wa.me/5493513278986?text=${encodeURIComponent("Hola, tengo una consulta...")}`;
        }

        function showCartFeedback() {
            const cartBtn = document.getElementById('openCart');
            cartBtn.classList.add('scale-110');
            setTimeout(() => cartBtn.classList.remove('scale-110'), 300);
        }

        init();

        window.openProductDetail = openProductDetail;
        window.updateModalQty = updateModalQty;
        window.changeQtyInGrid = changeQtyInGrid;
        window.addToCart = addToCart;
        window.toggleCart = toggleCart;
        window.closeModal = closeModal;
        window.removeFromCart = removeFromCart;
        window.updateCartQty = updateCartQty;
        window.finalizeOrder = finalizeOrder;
        window.handleSearchAndSort = handleSearchAndSort;
        window.toggleTheme = toggleTheme;
    </script>
</body>
</html>
